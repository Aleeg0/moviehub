services:
  db_test:
    image: postgres:17.8-alpine3.22
    container_name: moviehub-test-db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - test_database_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - .env.test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  test_database_data: